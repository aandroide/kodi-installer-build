name: Build Kodi APK con installazione abilitata

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Architettura"
        type: choice
        options:
          - both
          - arm64-v8a
          - armeabi-v7a
        default: both
      version:
        description: "Versione Kodi (es. 21.3)"
        default: "21.3"
      codename:
        description: "Nome release (es. Omega)"
        default: "Omega"
      new_package:
        description: "Nuovo nome pacchetto, 13 caratteri come org.xbmc.kodi"
        default: "it.andro.kodi"
      app_label:
        description: "Nome mostrato nel launcher"
        default: "Kodi Androide"
      commit_to_repo:
        description: "Salva anche gli APK nella cartella apk/ della repo"
        type: boolean
        default: true
      apk_url:
        description: "URL APK originale (solo con una singola architettura, vuoto = mirror ufficiale Kodi)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: kodi-build
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      archs: ${{ steps.m.outputs.archs }}
    steps:
      - id: m
        run: |
          if [ "${{ inputs.arch }}" = "both" ]; then
            echo 'archs=["armeabi-v7a","arm64-v8a"]' >> "$GITHUB_OUTPUT"
          else
            echo 'archs=["${{ inputs.arch }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.prepare.outputs.archs) }}
    env:
      APKTOOL_VERSION: "2.10.0"
      FINAL_APK: kodi-androide-${{ matrix.arch }}.apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Scarica apktool
        run: |
          curl -fsSL -o apktool.jar \
            "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VERSION}/apktool_${APKTOOL_VERSION}.jar"

      - name: Scarica APK originale
        run: |
          ARCH="${{ matrix.arch }}"
          VER="${{ inputs.version }}"
          NAME="${{ inputs.codename }}"
          URL="${{ inputs.apk_url }}"
          # con "both" l'indirizzo manuale non ha senso, si usa il mirror ufficiale
          if [ "${{ inputs.arch }}" = "both" ]; then URL=""; fi
          if [ -z "$URL" ]; then
            if [ "$ARCH" = "armeabi-v7a" ]; then DIR="arm"; else DIR="arm64-v8a"; fi
            URL="https://mirrors.kodi.tv/releases/android/${DIR}/kodi-${VER}-${NAME}-${ARCH}.apk"
          fi
          # Se e stato incollato il link della pagina kodi.tv/download/thanks,
          # estrae l'indirizzo reale del file dal parametro url=
          case "$URL" in
            *download/thanks*)
              URL="$(python3 -c 'import sys,urllib.parse as u; q=u.parse_qs(u.urlparse(sys.argv[1]).query); print(q["url"][0].split("?")[0])' "$URL")"
              ;;
          esac
          echo "Scarico $URL"
          curl -fL --retry 3 -A "Mozilla/5.0" -o original.apk "$URL"
          ls -la original.apk
          # Controlla che sia un vero APK (un file zip) e non una pagina HTML
          if ! unzip -tq original.apk >/dev/null 2>&1; then
            echo "Il file scaricato non e un APK valido. Controlla l'indirizzo."
            head -c 300 original.apk
            exit 1
          fi

      - name: Applica permesso e nuovo nome pacchetto
        env:
          APKTOOL: apktool.jar
          NEW_PACKAGE: ${{ inputs.new_package }}
          APP_LABEL: ${{ inputs.app_label }}
        run: ./patch_kodi.sh original.apk unsigned.apk

      - name: Allinea e firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "Build tools: $BT"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "Nessuna chiave nei secrets: ne creo una temporanea"
            PASS="android123"; ALIAS="kodi"
            keytool -genkeypair -keystore release.jks -storepass "$PASS" -keypass "$PASS" \
              -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Kodi Installer, O=Personale, C=IT"
          fi
          "$BT/zipalign" -p -f 4 unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-pass "pass:$PASS" --ks-key-alias "$ALIAS" \
            --out "$FINAL_APK" aligned.apk
          "$BT/apksigner" verify --print-certs "$FINAL_APK"
          "$BT/aapt2" dump badging "$FINAL_APK" | grep -E "^package:|application-label:|native-code"
          "$BT/aapt2" dump permissions "$FINAL_APK" | grep -i REQUEST_INSTALL_PACKAGES

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: ${{ env.FINAL_APK }}
          retention-days: 30

      - name: Pubblica nelle Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kodi-androide-${{ matrix.arch }}
          name: ${{ inputs.app_label }} ${{ inputs.version }} ${{ matrix.arch }}
          body: |
            Kodi ${{ inputs.version }} ${{ inputs.codename }} per ${{ matrix.arch }}.
            Pacchetto: ${{ inputs.new_package }}. Permesso di installare app abilitato.
          files: ${{ env.FINAL_APK }}
          make_latest: false

  salva_nella_repo:
    needs: build
    if: ${{ inputs.commit_to_repo }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          path: scaricati
          merge-multiple: true

      - name: Aggiorna la cartella apk
        run: |
          mkdir -p apk
          cp scaricati/*.apk apk/
          ls -la apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add apk
          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
            exit 0
          fi
          git commit -m "APK Kodi ${{ inputs.version }} (${{ inputs.arch }})"
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
